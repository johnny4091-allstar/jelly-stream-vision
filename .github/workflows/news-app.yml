name: News Hammer APK

# Builds the Expo app in news-app/ into an installable Android APK (download it from the run's
# "Artifacts" section), opens it on an Android emulator to make sure it starts, and only then,
# once UPDATE_REPO and RELEASES_TOKEN are set up, publishes it as a GitHub release so installed
# apps offer "Update now / Later". See news-app/README.md.

on:
  push:
    paths:
      - 'news-app/**'
      - '.github/workflows/news-app.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Run every JavaScript action on Node 24 (Node 20 is end-of-life).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-app
    env:
      # Public "owner/repo" the app checks for updates, and the build number.
      UPDATE_REPO: ${{ vars.UPDATE_REPO }}
      APP_VERSION_CODE: ${{ github.run_number }}
      # CARTO Basemaps key for the radar's street map (optional; masked in logs).
      CARTO_KEY: ${{ secrets.CARTO_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: news-app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # Gradle downloads the platform and build tools the generated project asks for.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Check news feeds
        # Information only: shows which feeds answer and how many stories and pictures each has.
        continue-on-error: true
        run: node scripts/check-feeds.mjs
      - name: Check market quotes
        # Information only: shows Yahoo Finance still answers the quote requests the app makes.
        continue-on-error: true
        run: node scripts/check-markets.mjs
      - name: Check weather forecast
        # Information only: shows Open-Meteo still answers the request the app makes.
        continue-on-error: true
        run: node scripts/check-weather.mjs
      - name: Check weather radar
        # Information only: shows RainViewer's radar list and tiles still load.
        continue-on-error: true
        run: node scripts/check-radar.mjs
      - name: Check Live TV channels
        # Information only: shows which channels are live and embeddable right now.
        continue-on-error: true
        run: node scripts/check-live.mjs
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: news-app/android
        # The generated project signs release builds with the debug key, so the APK installs directly.
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk news-hammer.apk
      - uses: actions/upload-artifact@v7
        with:
          name: news-hammer-apk
          path: news-app/news-hammer.apk
          if-no-files-found: error

  smoke-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPDATE_REPO: ${{ vars.UPDATE_REPO }}
    defaults:
      run:
        working-directory: news-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: news-hammer-apk
          path: news-app
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: news-app
          script: ./scripts/smoke-test.sh news-hammer.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test
          path: |
            news-app/logcat-*.txt
            news-app/screenshot-*.png
          if-no-files-found: ignore

  publish:
    # Only builds that open cleanly on the emulator reach installed apps.
    needs: [apk, smoke-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-app
    env:
      # Public "owner/repo" that holds the APK releases, and a token that can create releases there.
      UPDATE_REPO: ${{ vars.UPDATE_REPO }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: news-hammer-apk
          path: news-app
      - name: Publish APK for in-app updates
        if: env.GH_TOKEN != '' && env.UPDATE_REPO != ''
        # Installed apps check this repo's latest release and offer "Update now / Later".
        run: |
          # GitHub can't create a release in a repo with no commits, so give a new one a README.
          if ! gh api "repos/$UPDATE_REPO/commits?per_page=1" >/dev/null 2>&1; then
            printf '# News Hammer releases\n\nAPK builds of the News Hammer app. The app installs updates from here.\n' > releases-readme.md
            gh api -X PUT "repos/$UPDATE_REPO/contents/README.md" \
              -f message="Add README" -f content="$(base64 -w0 releases-readme.md)" >/dev/null
          fi
          # A re-run of the same build keeps its number; that release already exists.
          if gh release view "build-$APP_VERSION_CODE" --repo "$UPDATE_REPO" >/dev/null 2>&1; then
            echo "Release build-$APP_VERSION_CODE already exists"; exit 0
          fi
          VERSION="$(node -p "require('./app.json').expo.version").$APP_VERSION_CODE"
          # The update pop-up shows these lines under "What's new".
          if [ -s WHATSNEW.md ]; then cp WHATSNEW.md notes.md; else git log -1 --pretty=%s > notes.md; fi
          gh release create "build-$APP_VERSION_CODE" news-hammer.apk \
            --repo "$UPDATE_REPO" \
            --title "News Hammer $VERSION" \
            --notes-file notes.md \
            --latest
      - name: Updates not set up
        if: env.GH_TOKEN == '' || env.UPDATE_REPO == ''
        run: echo "::notice::Not publishing an in-app update. Add the UPDATE_REPO variable and RELEASES_TOKEN secret to turn it on (news-app/README.md)."
