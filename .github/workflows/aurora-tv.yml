name: Aurora TV

on:
  pull_request:
    paths: ["android-tv-aurora/**", ".github/workflows/aurora-tv.yml"]
  push:
    branches: [main]
    paths: ["android-tv-aurora/**", ".github/workflows/aurora-tv.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.9"

jobs:
  aurora-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-aurora
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-tv-debug
          path: android-tv-aurora/app/build/outputs/apk/debug/*.apk

  aurora-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-aurora
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Check signing secrets
        env:
          S_KS: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          S_SP: ${{ secrets.ANDROID_TV_STORE_PASSWORD }}
          S_KA: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          S_KP: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Keep printable ASCII only (0x21-0x7E): drops spaces, newlines, zero-width and other invisible chars.
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '\041-\176'; }
          fail=0
          for pair in "ANDROID_TV_KEYSTORE_BASE64:S_KS" "ANDROID_TV_STORE_PASSWORD:S_SP" "ANDROID_TV_KEY_ALIAS:S_KA" "ANDROID_TV_KEY_PASSWORD:S_KP"; do
            name="${pair%%:*}"; var="${pair##*:}"; raw="${!var}"
            cleaned="$(clean "$raw")"
            rawlen=$(printf '%s' "$raw" | LC_ALL=C wc -c | tr -d ' ')
            len=${#cleaned}
            echo "$name: filtered length=$len, discarded bytes=$((rawlen - len))"
            [ "$len" -gt 0 ] || { echo "::error::$name is empty"; fail=1; }
          done
          exit $fail

      - name: Prepare keystore
        env:
          S_KS: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          S_SP: ${{ secrets.ANDROID_TV_STORE_PASSWORD }}
          S_KA: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          S_KP: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '\041-\176'; }
          ks="$RUNNER_TEMP/aurora-tv-release.p12"
          clean "$S_KS" | base64 -d > "$ks"
          {
            echo "ANDROID_TV_KEYSTORE_FILE=$ks"
            echo "ANDROID_TV_STORE_PASSWORD=$(clean "$S_SP")"
            echo "ANDROID_TV_KEY_ALIAS=$(clean "$S_KA")"
            echo "ANDROID_TV_KEY_PASSWORD=$(clean "$S_KP")"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$(clean "$S_SP")"
          echo "::add-mask::$(clean "$S_KP")"

      - run: gradle --no-daemon assembleRelease

      - name: Verify signature and checksum
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          case "$apk" in *unsigned*) echo "::error::Release APK is unsigned"; exit 1;; esac
          out=app/build/outputs/apk/release/aurora-tv-release.apk
          [ "$apk" = "$out" ] || mv "$apk" "$out"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out"
          sha256sum "$out" | cut -d' ' -f1 | tr -d '\n' > "$out.sha256"
          echo "sha256: $(cat "$out.sha256")"
          rm -f "$ANDROID_TV_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-tv-release
          path: |
            android-tv-aurora/app/build/outputs/apk/release/aurora-tv-release.apk
            android-tv-aurora/app/build/outputs/apk/release/aurora-tv-release.apk.sha256
