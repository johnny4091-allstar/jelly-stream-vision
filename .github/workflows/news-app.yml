name: Headlines news app APK

# Builds the Expo app in news-app/ into an installable Android APK (download it from the run's
# "Artifacts" section) and, once EXPO_TOKEN and EAS_PROJECT_ID are set up, publishes an
# over-the-air update so installed apps offer "Update now / Later". See news-app/README.md.

on:
  push:
    paths:
      - 'news-app/**'
      - '.github/workflows/news-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-app
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: news-app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Gradle downloads the platform and build tools the generated project asks for.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: news-app/android
        # The generated project signs release builds with the debug key, so the APK installs directly.
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk headlines.apk
      - uses: actions/upload-artifact@v5
        with:
          name: headlines-apk
          path: news-app/headlines.apk
          if-no-files-found: error
      - name: Publish over-the-air update
        if: env.EXPO_TOKEN != '' && env.EAS_PROJECT_ID != ''
        run: >
          npx --yes eas-cli@25.3.0 update
          --channel production
          --environment production
          --platform android
          --message "$(git log -1 --pretty=%s)"
          --non-interactive
      - name: Updates not set up
        if: env.EXPO_TOKEN == '' || env.EAS_PROJECT_ID == ''
        run: echo "::notice::Skipping the over-the-air update. Add the EXPO_TOKEN secret and EAS_PROJECT_ID variable to turn it on (news-app/README.md)."
