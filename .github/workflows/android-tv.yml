name: Android TV APK

# Two independent apps share this workflow. They never touch each other's folder or secrets:
#   - DropAPK TV  -> folder android-tv/         secrets DROPAPK_*     jobs: debug, release
#   - Aurora TV   -> folder android-tv-aurora/  secrets ANDROID_TV_*  jobs: aurora-debug, aurora-release

on:
  push:
    paths:
      - 'android-tv/**'
      - 'android-tv-aurora/**'
      - '.github/workflows/android-tv.yml'
  pull_request:
    paths:
      - 'android-tv/**'
      - 'android-tv-aurora/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===================== DropAPK TV (unchanged) =====================
  # Pull requests and feature branches: debug build + lint, no secrets needed.
  debug:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/wrapper-validation@v5
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace -PdropapkVersionCode=$((100 + GITHUB_RUN_NUMBER))
      - name: Lint (warnings never fail the build)
        continue-on-error: true
        run: ./gradlew lintDebug
      - uses: actions/upload-artifact@v5
        with:
          name: dropapk-tv-debug
          path: |
            android-tv/app/build/outputs/apk/debug/app-debug.apk
            android-tv/app/build/reports/lint-results-debug.*
          if-no-files-found: error

  # main branch and manual runs: signed release APK.
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    env:
      DROPAPK_KEYSTORE_BASE64: ${{ secrets.DROPAPK_KEYSTORE_BASE64 }}
      DROPAPK_STORE_PASSWORD: ${{ secrets.DROPAPK_STORE_PASSWORD }}
      DROPAPK_KEY_ALIAS: ${{ secrets.DROPAPK_KEY_ALIAS }}
      DROPAPK_KEY_PASSWORD: ${{ secrets.DROPAPK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        run: |
          # Safe diagnostic: lengths and discarded-character counts only, never values.
          missing=""
          for s in DROPAPK_KEYSTORE_BASE64 DROPAPK_STORE_PASSWORD DROPAPK_KEY_ALIAS DROPAPK_KEY_PASSWORD; do
            total=$(printf '%s' "${!s}" | LC_ALL=C.UTF-8 wc -m | tr -d ' ')
            kept=$(printf '%s' "${!s}" | LC_ALL=C tr -cd '\041-\176' | wc -c | tr -d ' ')
            echo "$s: length after filtering=$kept, discarded characters=$((total - kept))"
            [ "$kept" -gt 0 ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty (after removing non-printable/non-ASCII characters) GitHub secrets:$missing. Add them under Settings → Secrets and variables → Actions (see android-tv/README.md). A release APK must be signed with the same key every time or TV updates will be rejected."
            exit 1
          fi

      - name: Decode keystore
        run: |
          printf '%s' "$DROPAPK_KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DROPAPK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/wrapper-validation@v5
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PdropapkVersionCode=$((100 + GITHUB_RUN_NUMBER)) \
            -PdropapkVersionName=1.3.${GITHUB_RUN_NUMBER}

      - name: Lint (warnings never fail the build)
        continue-on-error: true
        run: ./gradlew lintRelease

      - name: Verify signature and write sha256
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" | cut -d' ' -f1 > "$APK.sha256"
          echo "versionCode=$((100 + GITHUB_RUN_NUMBER)) sha256=$(cat $APK.sha256) size=$(stat -c%s $APK)" | tee app/build/outputs/apk/release/release-info.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: dropapk-tv-release
          path: |
            android-tv/app/build/outputs/apk/release/app-release.apk
            android-tv/app/build/outputs/apk/release/app-release.apk.sha256
            android-tv/app/build/outputs/apk/release/release-info.txt
          if-no-files-found: error

  # ===================== Aurora TV =====================
  aurora-debug:
    if: github.event_name == 'pull_request' && hashFiles('android-tv-aurora/settings.gradle.kts') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-aurora
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-tv-debug
          path: android-tv-aurora/app/build/outputs/apk/debug/*.apk

  aurora-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-aurora
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check signing secrets
        env:
          S_KS: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          S_SP: ${{ secrets.ANDROID_TV_STORE_PASSWORD }}
          S_KA: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          S_KP: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Keep printable ASCII only (0x21-0x7E): drops spaces, newlines, zero-width and other invisible chars.
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '\041-\176'; }
          fail=0
          for pair in "ANDROID_TV_KEYSTORE_BASE64:S_KS" "ANDROID_TV_STORE_PASSWORD:S_SP" "ANDROID_TV_KEY_ALIAS:S_KA" "ANDROID_TV_KEY_PASSWORD:S_KP"; do
            name="${pair%%:*}"; var="${pair##*:}"; raw="${!var}"
            cleaned="$(clean "$raw")"
            rawlen=$(printf '%s' "$raw" | LC_ALL=C wc -c | tr -d ' ')
            len=${#cleaned}
            echo "$name: filtered length=$len, discarded bytes=$((rawlen - len))"
            [ "$len" -gt 0 ] || { echo "::error::$name is empty"; fail=1; }
          done
          exit $fail

      - name: Prepare keystore
        env:
          S_KS: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          S_SP: ${{ secrets.ANDROID_TV_STORE_PASSWORD }}
          S_KA: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          S_KP: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '\041-\176'; }
          ks="$RUNNER_TEMP/aurora-tv-release.p12"
          clean "$S_KS" | base64 -d > "$ks"
          {
            echo "ANDROID_TV_KEYSTORE_FILE=$ks"
            echo "ANDROID_TV_STORE_PASSWORD=$(clean "$S_SP")"
            echo "ANDROID_TV_KEY_ALIAS=$(clean "$S_KA")"
            echo "ANDROID_TV_KEY_PASSWORD=$(clean "$S_KP")"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$(clean "$S_SP")"
          echo "::add-mask::$(clean "$S_KP")"

      - run: gradle --no-daemon assembleRelease

      - name: Verify signature and checksum
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          case "$apk" in *unsigned*) echo "::error::Release APK is unsigned"; exit 1;; esac
          out=app/build/outputs/apk/release/aurora-tv-release.apk
          [ "$apk" = "$out" ] || mv "$apk" "$out"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out"
          sha256sum "$out" | cut -d' ' -f1 | tr -d '\n' > "$out.sha256"
          echo "sha256: $(cat "$out.sha256")"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aurora-tv-release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-tv-release
          path: |
            android-tv-aurora/app/build/outputs/apk/release/aurora-tv-release.apk
            android-tv-aurora/app/build/outputs/apk/release/aurora-tv-release.apk.sha256
