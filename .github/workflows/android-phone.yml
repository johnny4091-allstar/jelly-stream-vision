name: Android phone APK

# Aurora phone app -> folder android-phone/, jobs phone-debug / phone-release.
# Release builds are signed with the same keystore as Aurora TV (ANDROID_TV_* secrets),
# so no extra secrets are needed. Never change the key after the first release, or
# installed phones will reject updates.

on:
  push:
    paths:
      - 'android-phone/**'
      - '.github/workflows/android-phone.yml'
  pull_request:
    paths:
      - 'android-phone/**'
      - '.github/workflows/android-phone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests and feature branches: unsigned debug build, no secrets needed.
  phone-debug:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-phone
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon assembleDebug
      - name: Lint (warnings never fail the build)
        continue-on-error: true
        run: gradle --no-daemon lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-mobile-debug
          path: android-phone/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # main branch and manual runs: signed release APK.
  phone-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-phone
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check signing secrets
        env:
          S_KS: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          S_SP: ${{ secrets.ANDROID_TV_STORE_PASSWORD }}
          S_KA: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          S_KP: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Keep printable ASCII only (0x21-0x7E): drops spaces, newlines, zero-width and other invisible chars.
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '\041-\176'; }
          fail=0
          for pair in "ANDROID_TV_KEYSTORE_BASE64:S_KS" "ANDROID_TV_STORE_PASSWORD:S_SP" "ANDROID_TV_KEY_ALIAS:S_KA" "ANDROID_TV_KEY_PASSWORD:S_KP"; do
            name="${pair%%:*}"; var="${pair##*:}"; raw="${!var}"
            cleaned="$(clean "$raw")"
            rawlen=$(printf '%s' "$raw" | LC_ALL=C wc -c | tr -d ' ')
            len=${#cleaned}
            echo "$name: filtered length=$len, discarded bytes=$((rawlen - len))"
            [ "$len" -gt 0 ] || { echo "::error::$name is empty"; fail=1; }
          done
          exit $fail

      - name: Prepare keystore
        env:
          S_KS: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          S_SP: ${{ secrets.ANDROID_TV_STORE_PASSWORD }}
          S_KA: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          S_KP: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '\041-\176'; }
          ks="$RUNNER_TEMP/aurora-mobile-release.p12"
          clean "$S_KS" | base64 -d > "$ks"
          {
            echo "ANDROID_PHONE_KEYSTORE_FILE=$ks"
            echo "ANDROID_PHONE_STORE_PASSWORD=$(clean "$S_SP")"
            echo "ANDROID_PHONE_KEY_ALIAS=$(clean "$S_KA")"
            echo "ANDROID_PHONE_KEY_PASSWORD=$(clean "$S_KP")"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$(clean "$S_SP")"
          echo "::add-mask::$(clean "$S_KP")"

      - run: gradle --no-daemon assembleRelease

      - name: Verify signature and checksum
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          case "$apk" in *unsigned*) echo "::error::Release APK is unsigned"; exit 1;; esac
          out=app/build/outputs/apk/release/aurora-mobile-release.apk
          [ "$apk" = "$out" ] || mv "$apk" "$out"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out"
          sha256sum "$out" | cut -d' ' -f1 | tr -d '\n' > "$out.sha256"
          echo "sha256: $(cat "$out.sha256")"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aurora-mobile-release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-mobile-release
          path: |
            android-phone/app/build/outputs/apk/release/aurora-mobile-release.apk
            android-phone/app/build/outputs/apk/release/aurora-mobile-release.apk.sha256
